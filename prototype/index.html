<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern Detectives (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #283040; --frame: #384858; --paper: #f8f8f0; --hp: #58d080; --gold: #f0b830; --red: #d04030; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
         gap: 10px; padding: 16px; background: #1f2633; color: var(--ink); font: 19px/1.35 "Pixelify Sans", monospace; }
  #screen { position: relative; width: 100%; max-width: 780px; aspect-ratio: 3 / 2; background: #000; overflow: hidden;
            border: 6px solid #4a5568; border-radius: 12px; }
  #map { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #battle, #page { position: absolute; inset: 0; overflow: auto; }
  #fx { position: absolute; inset: 0; z-index: 8; pointer-events: none; background: #000; }
  button { font: inherit; cursor: pointer; color: var(--ink); background: var(--paper); border: 3px solid var(--frame);
           border-radius: 8px; padding: 6px 16px; }
  button:hover:not(:disabled) { background: #fff8d0; }
  .proto { color: #9aa5b8; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  .help { color: #9aa5b8; font-size: 13px; }
  #mute { position: absolute; left: 8px; top: 8px; z-index: 6; font-size: 13px; padding: 2px 8px; border-width: 2px; }

  /* text box */
  #box { position: absolute; left: 8px; right: 8px; bottom: 8px; min-height: 92px; z-index: 5; cursor: pointer;
         background: var(--paper); border: 4px solid var(--frame); border-radius: 10px; box-shadow: inset 0 0 0 3px #a8c0d8;
         padding: 12px 40px 12px 18px; font-size: 21px; }
  #box p { margin: 0; }
  #box .more { position: absolute; right: 16px; bottom: 8px; color: var(--red); animation: blink .8s steps(2) infinite; }
  #box .choices { display: flex; gap: 10px; margin-top: 10px; }
  #box .choices button:focus { outline: 3px solid var(--red); }
  @keyframes blink { 50% { opacity: 0; } }

  /* map HUD */
  #hud { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; align-items: center; z-index: 4; font-size: 15px; }
  #hud button { padding: 2px 10px; border-width: 2px; }
  #hud .badges { background: var(--paper); border: 2px solid var(--frame); border-radius: 8px; padding: 2px 10px; }

  /* battle */
  .battle { display: flex; flex-direction: column; height: 100%; }
  .field { position: relative; flex: 1; min-height: 150px; background: linear-gradient(#c8e8f8 0 52%, #a8d880 52%); }
  .field::before, .field::after { content: ""; position: absolute; border-radius: 50%; background: #88c060; }
  .field::before { right: 8%; top: 52%; width: 38%; height: 14%; }
  .field::after { left: 3%; bottom: -4%; width: 34%; height: 16%; }
  .tag { position: absolute; z-index: 2; background: #f8f8e0; border: 3px solid var(--frame); border-radius: 10px 0 10px 0;
         padding: 4px 12px; font-size: 17px; min-width: 190px; }
  .tag b { display: block; }
  .tag small { color: #6a7080; }
  .foe-tag { left: 14px; top: 42px; }
  .me-tag { right: 14px; bottom: 10px; }
  .hp { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .hp span { background: #f0a030; color: #fff; padding: 0 4px; border-radius: 3px; }
  .bar { flex: 1; height: 9px; background: #506070; border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--hp); transition: width .4s, background .4s; }
  canvas.foe { position: absolute; z-index: 1; right: 10%; top: 4%; height: 60%; width: auto; }
  canvas.trainer { position: absolute; z-index: 1; right: 22%; top: 6%; height: 52%; width: auto; image-rendering: pixelated; }
  canvas.me { position: absolute; z-index: 1; left: 10%; bottom: 2%; height: 42%; width: auto; image-rendering: pixelated; }
  .panel { background: var(--frame); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .q { background: var(--paper); border-radius: 8px; padding: 8px 12px; margin: 0; font-size: 18px; }
  .sub { color: #ffe68a; margin: 0 4px; font-size: 16px; }
  .sub:empty { display: none; }
  .moves { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .moves button { display: flex; align-items: center; gap: 8px; padding: 4px 10px; text-align: left; font-size: 17px; }
  .moves button::before { content: "▶"; color: transparent; }
  .moves button.sel::before, .moves button:hover:not(:disabled)::before { color: var(--red); }
  .moves canvas { height: 54px; width: auto; }
  .moves button:disabled { opacity: .35; text-decoration: line-through; cursor: default; }

  /* pages */
  .page { min-height: 100%; padding: 26px 32px; display: flex; flex-direction: column; gap: 12px; }
  .title { background: linear-gradient(#78c8f0, #f8f0c0); align-items: center; justify-content: center; text-align: center; }
  .title h1 { font-size: 58px; margin: 0; color: #f8d030; text-shadow: 3px 3px 0 #2850a0, -2px -2px 0 #2850a0, 2px -2px 0 #2850a0, -2px 2px 0 #2850a0; }
  .title p { margin: 0; }
  .tsun { height: 150px; width: auto; }
  .hero { height: 110px; width: auto; image-rendering: pixelated; }
  .lab { background: linear-gradient(#e8e0d0 0 70%, #c8b898 70%); align-items: center; }
  .lab > canvas { height: 38%; min-height: 96px; max-height: 190px; image-rendering: pixelated; margin-top: 3%; }
  .chars { display: flex; gap: 14px; }
  .chars button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 16px; }
  .chars canvas { height: 72px; image-rendering: pixelated; }
  .note { background: #f7f1e3; background-image: repeating-linear-gradient(transparent 0 29px, rgba(100, 140, 190, .15) 29px 30px); }
  .note h2 { margin: 0; font-size: 34px; }
  .note p { margin: 0; }
  .note .topic { color: #3f7d5a; }
  .note .wrongnote { border-left: 4px solid #c0503a; padding-left: 12px; }
  .note .entry { border-bottom: 2px dashed #c9bfa8; padding-bottom: 10px; }
  .note canvas.anim { width: 100%; max-width: 420px; height: auto; align-self: center; }
  .extras { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .extras figure { margin: 0; text-align: center; font-size: 15px; }
  .extras canvas { width: 140px; height: auto; }
  .gloss dt { font-weight: 600; margin-top: 6px; }
  .gloss dd { margin: 0; }
  .badgecase { display: flex; gap: 28px; justify-content: center; flex-wrap: wrap; text-align: center; }
  canvas.badge { width: 96px; height: 96px; }
  .seg button.on { background: #fff3b0; border-color: var(--red); }
  .keys td { padding: 3px 14px 3px 0; }
  .keys kbd { background: var(--paper); border: 2px solid var(--frame); border-radius: 5px; padding: 0 6px; font: inherit; }
  .credits { height: 320px; width: 100%; overflow: hidden; position: relative; }
  .roll { animation: roll 26s linear forwards; }
  .roll h3 { margin: 18px 0 4px; color: #2850a0; }
  @keyframes roll { from { transform: translateY(320px); } to { transform: translateY(-110%); } }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* touch controls */
  #pad { display: none; gap: 24px; align-items: center; }
  #pad .dpad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 2px; }
  #pad button { padding: 0; font-size: 20px; }
  #pad .a, #pad .b { width: 60px; height: 60px; border-radius: 50%; color: #fff; }
  #pad .a { background: var(--red); }
  #pad .b { background: #4a6890; }
  @media (hover: none) { #pad { display: flex; } }
  @media (max-width: 600px) { body { font-size: 15px; } #box { font-size: 15px; min-height: 64px; } .tag { min-width: 130px; font-size: 13px; }
    .q, .moves button { font-size: 13px; } .title h1 { font-size: 34px; } .tsun { height: 90px; } }
</style>
</head>
<body>
<div id="screen">
  <canvas id="map" width="240" height="160"></canvas>
  <div id="hud" hidden><span class="badges"></span><button id="bcBtn">Badges</button><button id="nbBtn">Notebook</button><button id="setBtn">Settings</button></div>
  <div id="battle" hidden></div>
  <div id="page" hidden></div>
  <button id="mute" title="Mute (M)">Sound on</button>
  <div id="box" hidden><p></p><div class="choices" hidden></div><span class="more">▼</span></div>
  <div id="fx" hidden></div>
</div>
<div id="pad">
  <div class="dpad"><span></span><button data-k="ArrowUp">▲</button><span></span>
    <button data-k="ArrowLeft">◀</button><span></span><button data-k="ArrowRight">▶</button>
    <span></span><button data-k="ArrowDown">▼</button><span></span></div>
  <button class="b" id="padB" aria-label="Hold to fast-forward">B</button>
  <button class="a" data-k="Enter">A</button>
</div>
<div class="proto">Prototype · placeholder questions, art, and sounds</div>
<div class="help">Arrow keys/WASD walk · Enter/Space/Z talk · hold X fast-forward · N notebook · B badges · M mute</div>
<script>
// PROTOTYPE: placeholder Steps written for this mockup. The real Steps live in
// game/data/*.json and are written and checked by Bryce (see ADR 0002).
const LEVELS = [
  { name: "The Garden", steps: [
      { foe: "BUTTERFLY", topic: "Reflection symmetry", effect: "Reflection is super effective!", anim: "reflect",
        question: "Half of this butterfly is missing. Which picture completes it?",
        figure: { type: "butterfly", right: "missing" },
        options: [
          { figure: { type: "butterfly", right: "mirror" }, text: "A", correct: true },
          { figure: { type: "butterfly", right: "copy" }, text: "B", whyWrong: "B slides the same wing over without flipping it. That's a translation, not a reflection." },
          { figure: { type: "butterfly", right: "rotate" }, text: "C", whyWrong: "C turns the wing upside down (a 180° rotation). A mirror flips left and right only." },
          { figure: { type: "butterfly", right: "spots" }, text: "D", whyWrong: "D has the right shape, but its spots don't match the other side." },
        ],
        hint: "Imagine folding the page along the body. Both halves should land on each other exactly.",
        explanation: "A butterfly has reflection symmetry: the body is a line of symmetry, and each wing is the mirror image of the other. Every point on the left has a matching point the same distance away on the right." },
      { foe: "SNOWFLAKE", topic: "Rotational symmetry", effect: "Rotation is super effective!", anim: "rotate",
        question: "This snowflake lost an arm. The arms are spaced evenly. How many degrees apart are they?",
        figure: { type: "snowflake", arms: 6, missing: 1 },
        options: [
          { text: "60°", correct: true },
          { text: "72°", whyWrong: "72° = 360° ÷ 5. That counts only the five arms you can see, not the missing one." },
          { text: "90°", whyWrong: "90° = 360° ÷ 4 would give a snowflake with four arms." },
          { text: "45°", whyWrong: "45° = 360° ÷ 8 would give eight arms." },
        ],
        hint: "A full turn is 360°. How many arms would a complete snowflake have?",
        explanation: "A complete snowflake has 6 arms, so the arms are 360° ÷ 6 = 60° apart. Turning it by 60° lands it on itself: six-fold rotational symmetry. Ice crystals grow this way because water molecules lock into a hexagonal pattern." },
    ] },
  { name: "The Beehive", steps: [
      { foe: "FLOOR GAP", topic: "Tessellations", effect: "Tiling is super effective!",
        extras: [{ sides: 3, label: "Triangles: 6 × 60° = 360°" }, { sides: 4, label: "Squares: 4 × 90° = 360°" }, { sides: 6, label: "Hexagons: 3 × 120° = 360°" }],
        question: "Copies of each tile are placed around one corner. Which regular polygon fills the space with no gap?",
        figure: { type: "tiles", sides: 5 },
        options: [
          { figure: { type: "tiles", sides: 6 }, text: "Hexagon", correct: true },
          { figure: { type: "tiles", sides: 5 }, text: "Pentagon", whyWrong: "Each pentagon corner is 108°. Three make 324°, leaving a 36° gap." },
          { figure: { type: "tiles", sides: 8 }, text: "Octagon", whyWrong: "Each octagon corner is 135°. Two make 270°, leaving a 90° gap." },
          { figure: { type: "tiles", sides: 7 }, text: "Heptagon", whyWrong: "Each heptagon corner is about 128.6°. Two leave a gap and three overlap." },
        ],
        hint: "Tiles meeting at a point must add up to exactly 360°.",
        explanation: "A regular polygon tiles a floor by itself only if its corner angle divides 360° evenly. That works for the triangle (60°), the square (90°) and the hexagon (120°), and for no other regular polygon." },
      { foe: "HONEYCOMB", topic: "Why hexagons tile", effect: "Angle math is super effective!",
        question: "Why do hexagons fit together with no gaps?",
        figure: { type: "honeycomb" },
        options: [
          { text: "Three 120° corners make exactly 360°", correct: true },
          { text: "Six sides × 60° = 360°", whyWrong: "A hexagon's corner is 120°, not 60°. And it's the corners meeting at a point that matter, not the number of sides." },
          { text: "Any shape with an even number of sides fits", whyWrong: "Counterexample: the octagon has 8 sides but leaves gaps." },
          { text: "Bees bend the walls until they fit", whyWrong: "Flat regular hexagons tile perfectly with no bending. The angles alone explain it." },
        ],
        hint: "Look at the marked point where three cells meet. What is each corner's angle?",
        explanation: "Each corner of a regular hexagon is 120°, and three meet at every point: 3 × 120° = 360°. Hexagons also use the least wall to divide a surface into equal cells (Hales' honeycomb conjecture, proved in 2001), which saves the bees wax." },
    ] },
  { name: "The Sunflower Field", steps: [
      { foe: "SUNFLOWER", topic: "Fibonacci sequence", effect: "Fibonacci is super effective!",
        question: "This sunflower has 21 spirals one way and 34 the other. How many spirals would the next size up have?",
        figure: { type: "sunflower" },
        options: [
          { text: "55", correct: true },
          { text: "68", whyWrong: "68 doubles 34. The pattern adds the two numbers before instead." },
          { text: "47", whyWrong: "47 adds 13 to 34, as if the jump from 21 to 34 repeats. The jumps grow each time." },
          { text: "35", whyWrong: "35 counts up by one. The spiral counts grow much faster." },
        ],
        hint: "Look at how each number in 1, 1, 2, 3, 5, 8, 13, 21, 34 relates to the two before it.",
        explanation: "Each Fibonacci number is the sum of the two before it, so 21 + 34 = 55. Sunflower spirals almost always come in neighbouring Fibonacci numbers, as do pinecones and pineapples." },
      { foe: "GOLDEN RATIO", topic: "The golden ratio", effect: "The golden ratio is super effective!",
        question: "Divide each Fibonacci number by the one before it. What do the answers get closer to?",
        figure: { type: "ratios" },
        options: [
          { text: "About 1.618", correct: true },
          { text: "2", whyWrong: "Each number is less than double the one before (34 < 2 × 21), so the ratio stays below 2." },
          { text: "1.5", whyWrong: "3/2 = 1.5 is an early ratio, but later ones settle above it: 1.6, 1.625, 1.615…" },
          { text: "They keep growing forever", whyWrong: "The numbers grow, but their ratio settles down, bouncing closer and closer to one number." },
        ],
        hint: "Work out 34 ÷ 21 and compare it with the ratios already shown.",
        explanation: "The ratios 8/5 = 1.6, 13/8 = 1.625, 21/13 ≈ 1.615, 34/21 ≈ 1.619 approach the golden ratio φ = (1 + √5) / 2 ≈ 1.618. It shows up in the growth of shells and seed heads." },
    ] },
  { name: "Field Station", steps: [
      { foe: "THE BIG PICTURE", topic: "Math as a science of patterns", effect: "Pattern sense is super effective!",
        question: "What do the butterfly, the honeycomb, and the sunflower have in common?",
        figure: { type: "trio" },
        options: [
          { text: "Each follows a rule math can describe", correct: true },
          { text: "They are all made by insects", whyWrong: "Sunflowers and snowflakes aren't made by insects. The link is the pattern, not the maker." },
          { text: "They are all random", whyWrong: "Each one follows an exact rule: reflection, 120° corners, or adding the two numbers before." },
          { text: "They all have exactly six parts", whyWrong: "Only the snowflake and the hexagon involve six. A butterfly has two halves; a sunflower has 21, 34, 55… spirals." },
        ],
        hint: "Think about what you did at each site: you found a rule.",
        explanation: "Symmetry, tessellation, and the Fibonacci numbers are all rules that can be written in mathematics. As Devlin (2000) puts it, mathematics is the science of patterns." },
    ] },
];
const TOTAL = LEVELS.reduce((n, l) => n + l.steps.length, 0);
const BADGES = ["Symmetry Badge", "Tiling Badge", "Fibonacci Badge"];
const MAX_HP = 3;
const GLOSSARY = [
  ["Reflection symmetry", "A shape has reflection symmetry if flipping it across a line (the line of symmetry) gives back the same shape."],
  ["Rotational symmetry", "A shape has rotational symmetry if turning it by less than a full turn about its center gives back the same shape. A six-armed snowflake matches itself every 360° ÷ 6 = 60°."],
  ["Regular polygon", "A polygon whose sides are all equal and whose angles are all equal."],
  ["Interior angle", "The angle inside a polygon at one corner. In a regular polygon with n sides, each one is (n − 2) × 180° ÷ n."],
  ["Tessellation", "A covering of a flat surface by shapes, with no gaps and no overlaps."],
  ["Fibonacci sequence", "1, 1, 2, 3, 5, 8, 13, … Each number after the first two is the sum of the two before it."],
  ["Golden ratio (φ)", "φ = (1 + √5) ÷ 2 ≈ 1.618. Ratios of neighbouring Fibonacci numbers get closer and closer to it."],
];
const DURWIN_TALK = [
  ["SIR DURWIN: Two students are waiting by the Garden, up the path to the west.", "SIR DURWIN: Beat them both in a pattern battle to earn the Symmetry Badge!"],
  ["SIR DURWIN: Splendid work! Two more students wait by the Beehive, straight north."],
  ["SIR DURWIN: Two badges already! The last students are by the Sunflower Field to the north-east."],
];
const NPC_TALK = {
  "2,4": ["GIRL: I saw a butterfly that looked the same on both sides. Weird, right?"],
  "10,4": ["BEEKEEPER: My bees never waste wax. Something about their corners, I think..."],
};
const SIGNS = {
  "5,2": ["SIGN: ← THE GARDEN · THE BEEHIVE →"],
  "10,2": ["SIGN: ← THE BEEHIVE · THE SUNFLOWER FIELD →"],
  "9,7": ["SIGN: FIELD STATION. Sir Durwin's pattern research lab."],
};
// Each student battles you with one Step. Beat both students at a site to earn its badge.
const STUDENTS = {
  "2,2": { name: "MIA", level: 0, step: 0, look: { hat: "#e8a030", shirt: "#e070a0", pants: "#404858" },
           intro: "Butterflies are my favorite! Can you finish this one?", lose: "Wow, you really know your mirrors!" },
  "4,2": { name: "LEO", level: 0, step: 1, look: { hat: "#402818", shirt: "#50a070", pants: "#303840" },
           intro: "It's chilly in the shade. Count my snowflake's arms!", lose: "Brr! You spun that one right round." },
  "7,2": { name: "ANA", level: 1, step: 0, look: { hat: "#202020", shirt: "#f0d040", pants: "#5a4630" },
           intro: "My floor has a gap in it. Which tile fixes it?", lose: "No gaps, no overlaps. Nice!" },
  "9,2": { name: "RAF", level: 1, step: 1, look: { hat: "#704020", shirt: "#d05030", pants: "#303840" },
           intro: "The bees told me a secret about angles. Do you know it?", lose: "Buzz! You cracked the honeycomb." },
  "12,1": { name: "JOY", level: 2, step: 0, look: { hat: "#f0d060", shirt: "#60a0e0", pants: "#404858" },
            intro: "I counted every spiral on this sunflower. Can you keep going?", lose: "You're a natural at Fibonacci!" },
  "12,2": { name: "KIT", level: 2, step: 1, look: { hat: "#303030", shirt: "#a060c0", pants: "#5a4630" },
            intro: "Let's divide some Fibonacci numbers. Ready?", lose: "1.618... I'll never forget it now." },
};
const CHARS = {
  CHIPPY: { look: { hat: "#48a050", shirt: "#f08030", pants: "#3a3a48" },
            pick: "CHIPPY: Notebook ready, pencil sharpened. Let's go!", win: "CHIPPY: Every page is full. Best field trip ever!" },
  BRYCE: { look: { hat: "#3a2a20", shirt: "#3878c8", pants: "#5a4630" },
           pick: "BRYCE: Patterns? I'll check every answer twice.", win: "BRYCE: Checked, double-checked, and recorded!" },
  JOSHUA: { look: { hat: "#181818", shirt: "#c03838", pants: "#303848" },
            pick: "JOSHUA: I'll figure out the rule behind all of it.", win: "JOSHUA: Every pattern ran on a rule. Just like code!" },
};
const player = () => (CHARS[S.name] || CHARS.CHIPPY).look;

// 15 × 10 tiles of 16 px = 240 × 160, the GBA screen size.
// T tree · . grass , tall grass = path · L lab · D Sir Durwin · N villager · P student · I sign · G/H/S the three sites
const MAP = [
  "TTTTTTTTTTTTTTT",
  "T..G....H...PST",
  "T.P=PI.P=PI.P=T",
  "T..===========T",
  "T.N.....=.N...T",
  "T,,,....=..,,,T",
  "T,,,....=..,,,T",
  "T..LL...=I....T",
  "T..LLD===.....T",
  "TTTTTTTTTTTTTTT",
];
const TILE = 16;
const HOME = [6, 8]; // the path tile beside Sir Durwin
const DURWIN = { hat: "#b8b8c0", shirt: "#f8f8f8", pants: "#404858", glasses: true };
const NPCS = { "2,4": { hat: "#8048b0", shirt: "#e05050", pants: "#404040" }, "10,4": { hat: "#303030", shirt: "#f0b030", pants: "#604020" } };

// ---------- pixel sprites ----------
function px(c, col, x, y, w, h) { c.fillStyle = col; c.fillRect(x, y, w, h); }
function drawPerson(c, x, y, p, frame = 0) { // frame 1 and 2 lift one leg for the walk cycle
  px(c, p.hat, x + 4, y + 1, 8, 3); px(c, p.hat, x + 3, y + 3, 10, 1);
  px(c, "#f8c8a0", x + 5, y + 4, 6, 5);
  if (p.glasses) px(c, "#202830", x + 5, y + 6, 6, 1);
  else { px(c, "#202830", x + 6, y + 6, 1, 1); px(c, "#202830", x + 9, y + 6, 1, 1); }
  px(c, p.shirt, x + 4, y + 9, 8, 4); px(c, "#f8c8a0", x + 3, y + 9, 1, 3); px(c, "#f8c8a0", x + 12, y + 9, 1, 3);
  px(c, p.pants, x + 5, y + 13, 2, frame === 1 ? 2 : 3); px(c, p.pants, x + 9, y + 13, 2, frame === 2 ? 2 : 3);
  if (p.shirt === "#f8f8f8") { px(c, "#a0a8b8", x + 4, y + 9, 1, 4); px(c, "#a0a8b8", x + 11, y + 9, 1, 4); }
}
function drawTile(c, t, X, Y, x, y) {

// ---------- state, saving, text box ----------

}

  if (!S.queue.length) { box.hidden = true; const f = S.after; S.after = null; if (f) f(); return; }

  if ("3-0" in S.results) return say(["SIR DURWIN: Your notebook is complete. Splendid work!"]);
  S.level = 3; S.step = 0;
  S.trainer = { label: "SIR DURWIN", look: DURWIN, intro: "All three badges! Let's see what you've learned.", lose: "Splendid. You've seen the big picture." };
  startStep();
}

// ---------- battle ----------
function flash(cb) { // white flashes, then black, then the battle fades in
  S.mode = "busy"; fx.hidden = false; SFX.encounter();
  const W = "#fff";
  const a = fx.animate([{ opacity: 0, background: W }, { opacity: 1, background: W }, { opacity: 0, background: W }, { opacity: 1, background: W },
    { opacity: 0, background: W }, { opacity: 1, background: "#000" }], { duration: 700, fill: "forwards" });
  setTimeout(() => { // timers, not onfinish, so a backgrounded tab can't leave the game stuck mid-flash
    cb();
    const b = fx.animate([{ opacity: 1, background: "#000" }, { opacity: 0, background: "#000" }], { duration: 350, fill: "forwards" });
    setTimeout(() => { fx.hidden = true; a.cancel(); b.cancel(); }, 350);
  }, 700);
}
function startStep() { S.firstTry = true; S.wrongs = []; battle(true); }
function battle(first) {
  const st = LEVELS[S.level].steps[S.step], T = S.trainer;
  S.hp = MAX_HP; S.sel = 0;
  const opts = shuffle(st.options);
  flash(() => {
    battleEl.innerHTML = `<div class="battle">
      <div class="field">
        <div class="tag foe-tag"><b>${T.label}</b><small>wants to battle!</small></div>
        <canvas class="trainer" width="16" height="16"></canvas>
        <canvas class="foe" width="320" height="180" style="opacity:0"></canvas>
        <canvas class="me" width="16" height="16"></canvas>
        <div class="tag me-tag"><b>${S.name}</b><div class="hp"><span>HP</span><div class="bar"><i></i></div></div><small class="hpn"></small></div>
      </div>
      <div class="panel"><p class="q">${st.question}</p><p class="sub"></p>
        <div class="moves">${opts.map((o, i) => `<button data-i="${i}">${o.figure ? '<canvas width="150" height="84"></canvas>' : ""}<span>${o.text}</span></button>`).join("")}</div>
      </div></div>`;
    show("battle");
    drawFigure(battleEl.querySelector("canvas.foe"), st.figure);
    drawPerson(battleEl.querySelector("canvas.trainer").getContext("2d"), 0, 0, T.look);
    drawPerson(battleEl.querySelector("canvas.me").getContext("2d"), 0, 0, player());
    updateHp(); markSel();
    battleEl.querySelectorAll(".moves button").forEach((btn) => {
      const o = opts[btn.dataset.i];
      if (o.figure) drawFigure(btn.querySelector("canvas"), o.figure);
      btn.onclick = () => pick(st, o, btn);
    });
    say([`${T.label}: ${first ? T.intro : "Let's try that one again!"}`], () => { sendOut(st); say([`${T.label} sent out ${st.foe}!`]); });
  });
}
function sendOut(st) { // the trainer steps aside and the pattern pops in
  const trainer = battleEl.querySelector("canvas.trainer"), foe = battleEl.querySelector("canvas.foe");
  trainer.animate([{ transform: "translateX(0)", opacity: 1 }, { transform: "translateX(140%)", opacity: 0 }], { duration: 450 });
  foe.animate([{ opacity: 0, transform: "scale(.4)" }, { opacity: 1, transform: "scale(1)" }], { duration: 450 });
  trainer.style.opacity = 0; foe.style.opacity = 1; // end state, even if the tab isn't animating
  battleEl.querySelector(".foe-tag").innerHTML = `<b>${st.foe}</b><small>${st.topic}</small>`;
  SFX.select();
}
function updateHp() {
  const bar = battleEl.querySelector(".bar i");
  bar.style.width = `${(S.hp / MAX_HP) * 100}%`;
  bar.style.background = S.hp === 1 ? "#e04830" : S.hp === 2 ? "#f0c030" : "";
  battleEl.querySelector(".hpn").textContent = `${S.hp}/${MAX_HP}` + (S.streak ? ` · streak ${S.streak}` : "");
}
function markSel() {
  const btns = [...battleEl.querySelectorAll(".moves button")];
  if (btns[S.sel] && btns[S.sel].disabled) S.sel = Math.max(0, btns.findIndex((b) => !b.disabled));
  btns.forEach((b, i) => b.classList.toggle("sel", i === S.sel));
}
function pick(st, o, btn) {
  if (!box.hidden || btn.disabled || S.mode !== "battle") return;
  const T = S.trainer;
  if (o.correct) {
    const key = `${S.level}-${S.step}`;
    if (!(key in S.results)) S.results[key] = S.firstTry;
    S.streak = S.firstTry ? S.streak + 1 : 0;
    save(); SFX.hit(); setTimeout(SFX.win, 450);
    const foe = battleEl.querySelector("canvas.foe");
    foe.animate([{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(40px)", opacity: 0 }], { duration: 600 });
    foe.style.opacity = 0;
    return say([st.effect, `${st.foe} was recorded in your Field Notebook!`, ...(S.streak >= 2 ? [`First-try streak: ${S.streak}!`] : []),
      `${T.label}: ${T.lose}`], () => entry(st));
  }
  btn.disabled = true; S.firstTry = false; S.streak = 0; S.hp--;
  if (!S.wrongs.includes(o)) S.wrongs.push(o);
  updateHp(); markSel(); SFX.wrong();
  battleEl.querySelector(".field").animate([{ transform: "translateX(0)" }, { transform: "translateX(-8px)" }, { transform: "translateX(8px)" }, { transform: "translateX(0)" }], { duration: 260 });
  battleEl.querySelector("canvas.me").animate([{ opacity: 1 }, { opacity: 0.2 }, { opacity: 1 }, { opacity: 0.2 }, { opacity: 1 }], { duration: 500 });
  if (S.hp <= 0) return say([`${S.name} is out of HP!`, `${S.name} blacked out!`, "SIR DURWIN: Don't give up. Let's look at that one again."], () => battle(false));
  say([`Not quite... ${S.name} lost 1 HP!`, o.whyWrong], () => { battleEl.querySelector(".sub").textContent = `SIR DURWIN: "${st.hint}"`; });
}
function battleKey(k) {
  const btns = [...battleEl.querySelectorAll(".moves button")];
  const d = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -2, ArrowDown: 2, a: -1, d: 1, w: -2, s: 2 }[k];
  if (d !== undefined) { const n = S.sel + d; if (n >= 0 && n < btns.length && !btns[n].disabled) { S.sel = n; SFX.blip(); } markSel(); return; }
  if (["Enter", " ", "z"].includes(k) && btns[S.sel]) btns[S.sel].click();
}

// ---------- pages ----------
function page(html) { animTok++; S.back = null; pageEl.innerHTML = html; show("page"); pageEl.scrollTop = 0; }
function entry(st) {
  const notes = S.wrongs.map((o) => `<p class="wrongnote"><b>You tried ${o.text}:</b> ${o.whyWrong}</p>`).join("");
  page(`<div class="page note"><div class="proto">Field Notebook · new entry</div><h2>${st.foe}</h2><p class="topic">${st.topic}</p>
    ${st.anim ? '<canvas class="anim" width="420" height="220"></canvas>' : ""}
    ${st.extras ? `<div class="extras">${st.extras.map((e) => `<figure><canvas width="160" height="120"></canvas><figcaption>${e.label}</figcaption></figure>`).join("")}</div>` : ""}
    <p>${st.explanation}</p>${notes}
    <div class="row" style="margin-top:auto"><button id="nx">Next ▶</button></div></div>`);
  if (st.anim) runAnim(pageEl.querySelector("canvas.anim"), st.anim);
  if (st.extras) pageEl.querySelectorAll(".extras canvas").forEach((c, i) => drawFigure(c, { type: "tiles", sides: st.extras[i].sides }));
  $("#nx").focus({ preventScroll: true });
  $("#nx").onclick = () => {
    SFX.select();
    if (S.level === 3) return hallOfFame();
    if (LEVELS[S.level].steps.every((_, i) => beaten(S.level, i))) return levelDone();
    show("map"); say(["Another student here is still waiting to battle."]);
  };
}
function levelDone() {
  const lv = S.level;
  S.badges = Math.max(S.badges, lv + 1); save();
  show("map"); SFX.badge();
  say([`${S.name} earned the ${BADGES[lv]}!`, `${LEVELS[lv].name} summary: ${stars(lv)} (${firstTries(lv)} of 2 on the first try)`], () =>
    choice(S.badges === 3 ? "All three badges! Hurry back to SIR DURWIN?" : "Hurry back to the Field Station?", ["Yes", "No"], (i) => {
      if (i === 0) { [S.px, S.py] = HOME; S.mv = null; }
    }));
}
function notebook() {
  const rec = LEVELS.flatMap((l, li) => l.steps.map((st, si) => ({ st, key: `${li}-${si}` }))).filter((r) => r.key in S.results);
  page(`<div class="page note"><div class="proto">Field Notebook</div><h2>${S.name}'s Notebook</h2>
    <p class="topic">${rec.length} of ${TOTAL} patterns recorded</p>
    ${rec.length ? rec.map(({ st }) => `<div class="entry"><b>${st.foe}</b> · <span class="topic">${st.topic}</span><p>${st.explanation}</p></div>`).join("") : "<p>No entries yet. Go find some patterns!</p>"}
    <h2 style="font-size:26px; margin-top:8px">Glossary</h2>
    <dl class="gloss">${GLOSSARY.map(([t, d]) => `<dt>${t}</dt><dd>${d}</dd>`).join("")}</dl>
    <div class="row"><button id="close">Close</button></div></div>`);
  S.back = () => show("map"); $("#close").onclick = S.back;
}
function badgeCase() {
  page(`<div class="page note"><div class="proto">Badge case</div><h2>${S.name}'s Badges</h2>
    <div class="badgecase">${BADGES.map((b, i) => `<div><canvas class="badge" width="64" height="64"></canvas>
      <p><b>${i < S.badges ? b : "???"}</b></p><p class="topic">${LEVELS[i].name}</p><p>${stars(i)}</p></div>`).join("")}</div>
    <div class="row" style="margin-top:auto"><button id="close">Close</button></div></div>`);
  pageEl.querySelectorAll("canvas.badge").forEach((c, i) => drawBadge(c.getContext("2d"), i, i < S.badges));
  S.back = () => show("map"); $("#close").onclick = S.back;
}
function settingsPage(back) {
  page(`<div class="page note"><div class="proto">Settings</div><h2>Settings</h2>
    <p><b>Text speed</b></p>
    <div class="row seg" style="justify-content:flex-start">${Object.keys(SPEEDS).map((k) => `<button data-s="${k}" class="${settings.speed === k ? "on" : ""}">${k[0].toUpperCase() + k.slice(1)}</button>`).join("")}</div>
    <p><b>Volume</b></p><input id="vol" type="range" min="0" max="100" step="5" value="${Math.round(settings.vol * 100)}" style="max-width:320px">
    <div class="row" style="margin-top:auto"><button id="close">Done</button></div></div>`);
  pageEl.querySelectorAll(".seg button").forEach((b) => (b.onclick = () => { settings.speed = b.dataset.s; settingsPage(back); SFX.select(); }));
  $("#vol").oninput = (e) => { settings.vol = e.target.value / 100; SFX.blip(); };
  S.back = () => { save(); back(); }; $("#close").onclick = S.back;
}
function controls() {
  const keys = [["Arrow keys / WASD", "Walk, and move around the battle menu"], ["Enter / Space / Z", "Talk, read signs, pick a move, continue text"],
    ["Hold X", "Fast-forward through text"], ["N", "Field Notebook and glossary"], ["B", "Badge case"], ["M", "Sound on or off"], ["Esc", "Close a menu"]];
  page(`<div class="page note"><div class="proto">Controls</div><h2>Controls</h2>
    <table class="keys">${keys.map(([k, d]) => `<tr><td><kbd>${k}</kbd></td><td>${d}</td></tr>`).join("")}</table>
    <p>On a phone, use the arrows and the A and B buttons under the screen.</p>
    <div class="row" style="margin-top:auto"><button id="close">Back</button></div></div>`);
  S.back = title; $("#close").onclick = title;
}
function demo() { // for the live presentation: start at any site with the earlier badges already earned
  const spots = [["The Garden", 0, 3, 3], ["The Beehive", 1, 8, 3], ["The Sunflower Field", 2, 13, 3], ["Final battle", 3, ...HOME]];
  page(`<div class="page title"><h1>Demo mode</h1><p>Jump straight to a site. Earlier badges are given to you.</p>
    <div class="row">${spots.map(([n], i) => `<button data-i="${i}">${n}</button>`).join("")}</div>
    <div class="row"><button id="close">Back</button></div></div>`);
  pageEl.querySelectorAll("button[data-i]").forEach((b) => (b.onclick = () => {
    const [, badges, x, y] = spots[b.dataset.i];
    audioOn(); SFX.select();
    const results = {};
    for (let l = 0; l < badges; l++) LEVELS[l].steps.forEach((_, s) => (results[`${l}-${s}`] = true));
    Object.assign(S, { badges, results, px: x, py: y, mv: null, streak: 0 });
    show("map");
  }));
  S.back = title; $("#close").onclick = title;
}
function title() {
  const saved = load();
  if (saved && saved.settings) Object.assign(settings, saved.settings);
  updateMute();
  page(`<div class="page title"><canvas class="tsun" width="360" height="180"></canvas><h1>Pattern Detectives</h1><p>A pattern-finding adventure</p>
    <div class="row"><button id="new">New game</button>${saved && saved.badges ? `<button id="cont">Continue (${saved.badges} badge${saved.badges > 1 ? "s" : ""})</button>` : ""}</div>
    <div class="row"><button id="demo">Demo mode</button><button id="ctrl">Controls</button><button id="sets">Settings</button></div></div>`);
  runAnim(pageEl.querySelector(".tsun"), "title");
  $("#new").onclick = () => { audioOn(); SFX.select(); intro(); };
  if ($("#cont")) $("#cont").onclick = () => {
    audioOn(); SFX.select();
    Object.assign(S, { name: saved.name, badges: saved.badges, results: saved.results || {}, px: 7, py: 8, mv: null, streak: 0 }); show("map");
  };
  $("#demo").onclick = () => { audioOn(); demo(); };
  $("#ctrl").onclick = controls;
  $("#sets").onclick = () => { audioOn(); settingsPage(title); };
}
function intro() {
  Object.assign(S, { badges: 0, results: {}, px: 7, py: 8, mv: null, streak: 0 });
  page(`<div class="page lab"><canvas width="16" height="16"></canvas></div>`);
  drawPerson(pageEl.querySelector("canvas").getContext("2d"), 0, 0, DURWIN);
  say(["Hello there! I'm SIR DURWIN, but people call me the Pattern Professor.",
       "This world is full of patterns: on butterfly wings, inside beehives, in sunflower heads.",
       "Every pattern follows a rule. My research is finding those rules.",
       "Now, which of my three assistants is reporting for duty today?"], chooseChar);
}
function chooseChar() {
  pageEl.querySelector(".lab").insertAdjacentHTML("beforeend",
    `<div class="chars">${Object.keys(CHARS).map((n) => `<button data-n="${n}"><canvas width="16" height="16"></canvas>${n}</button>`).join("")}</div>`);
  pageEl.querySelectorAll(".chars button").forEach((b) => {
    drawPerson(b.querySelector("canvas").getContext("2d"), 0, 0, CHARS[b.dataset.n].look);
    b.onclick = () => {
      S.name = b.dataset.n; SFX.select();
      pageEl.querySelector(".chars").remove(); save();
      say([CHARS[S.name].pick, `SIR DURWIN: Right! ${S.name}, you'll be my research assistant.`,
           "SIR DURWIN: Take this FIELD NOTEBOOK. Every pattern you figure out gets recorded in it.",
           "SIR DURWIN: Students are waiting at three sites north of here. Beat them in pattern battles to earn badges.",
           "SIR DURWIN: Off you go!"], () => show("map"));
    };
  });
}
function hallOfFame() {
  const score = Object.values(S.results).filter(Boolean).length;
  SFX.badge();
  page(`<div class="page title"><h1>Hall of Fame</h1><canvas class="hero" width="16" height="16"></canvas>
    <p>${CHARS[S.name].win}</p>
    <div class="row">${BADGES.map(() => '<canvas class="badge" width="64" height="64" style="width:56px;height:56px"></canvas>').join("")}</div>
    <p>${LEVELS.slice(0, 3).map((l, i) => `${l.name} ${stars(i)}`).join(" · ")}</p>
    <p style="font-size:26px">${score} of ${TOTAL} on the first try</p>
    <div class="row"><button id="cred">Credits</button><button id="again">Play again</button></div></div>`);
  drawPerson(pageEl.querySelector(".hero").getContext("2d"), 0, 0, player());
  pageEl.querySelectorAll("canvas.badge").forEach((c, i) => drawBadge(c.getContext("2d"), i, true));
  $("#cred").onclick = credits;
  $("#again").onclick = playAgain;
}
function credits() {
  page(`<div class="page title"><div class="credits"><div class="roll">
    <h1>Pattern Detectives</h1><p>MATH 10 · Mathematics in the Modern World · Section M2</p>
    <h3>Team</h3><p>Bryce Go · Mathematics lead and writer</p><p>Joshua Tan · Game developer</p><p>Adrian Wong · Art, audio, and documentation</p>
    <h3>Instructor</h3><p>Durwin C. Santos, M.S., our Sir Durwin</p>
    <h3>References</h3><p>Devlin (2000) · Hales (2001) · Knott (n.d.) · Stewart (2017)</p>
    <h3>Thanks for playing!</h3></div></div>
    <div class="row"><button id="again">Play again</button></div></div>`);
  $("#again").onclick = playAgain;
}
function playAgain() { Object.assign(S, { badges: 0, results: {} }); save(); title(); }

// ---------- input ----------
const DIRS = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
function updateMute() { $("#mute").textContent = settings.muted ? "Sound off" : "Sound on"; }
function toggleMute() { settings.muted = !settings.muted; updateMute(); save(); }
function key(k) {
  if (S.choosing) return;
  if (!box.hidden) { if (["Enter", " ", "z"].includes(k)) next(); return; }
  if (k === "m") return toggleMute();
  if (S.mode === "battle") return battleKey(k);
  if (S.mode === "page") { if (k === "Escape" && S.back) S.back(); return; }
  if (S.mode !== "map") return;
  if (DIRS[k]) move(...DIRS[k]);
  else if (k === "n") notebook();
  else if (k === "b") badgeCase();
}
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === "x") { S.ffwd = true; return; }
  if (S.choosing) { // arrow keys move between the Yes/No buttons; Enter presses the focused one
    const bs = [...box.querySelectorAll(".choices button")], i = bs.indexOf(document.activeElement);
    if (k === "ArrowLeft" || k === "ArrowRight") { e.preventDefault(); bs[(i + (k === "ArrowRight" ? 1 : bs.length - 1)) % bs.length].focus(); }
    return;
  }
  if (k.startsWith("Arrow") || k === " " || (k === "Enter" && (S.mode !== "page" || !box.hidden))) e.preventDefault();
  if (e.repeat && !DIRS[k]) return;
  key(k);
});
document.addEventListener("keyup", (e) => { if (e.key.toLowerCase() === "x") S.ffwd = false; });
box.onclick = next;
$("#mute").onclick = () => { audioOn(); toggleMute(); };
$("#nbBtn").onclick = notebook;
$("#bcBtn").onclick = badgeCase;
$("#setBtn").onclick = () => settingsPage(() => show("map"));
document.querySelectorAll("#pad button[data-k]").forEach((b) => (b.onclick = () => key(b.dataset.k)));
const padB = $("#padB");
padB.onpointerdown = () => (S.ffwd = true);
padB.onpointerup = padB.onpointerleave = () => (S.ffwd = false);

title();
</script>
</body>
</html>
